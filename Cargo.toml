[package]
name = "git-chronos"
version = "0.1.0"
edition = "2021"
authors = ["Ritesh"]
description = "Animated git history timeline visualization generator"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
image = "0.25"
imageproc = "0.25"
ab_glyph = "0.2"
gif = "0.13"
anyhow = "1.0"
thiserror = "1.0"
tempfile = "3.10"
regex = "1.10"

[dev-dependencies]
tempfile = "3.10"
